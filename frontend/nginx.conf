server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 200m;   # mesmo limite do upload da API

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }

  location / {
    try_files $uri /index.html;   # rotas do React Router (/t/<id>)
  }
}
