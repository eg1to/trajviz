[project]
name = "trajviz-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "bashlex>=0.18",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "orjson>=3.13.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
