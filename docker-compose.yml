# trajviz: `docker compose up --build`  →  web em http://localhost:${WEB_PORT:-5173}, API em http://localhost:${API_PORT:-8010}/docs
# Sem backend/.env (ou sem ANTHROPIC_API_KEY) o fallback em LLM fica desligado e o app funciona só com as regras.
services:
  api:
    build: ./backend
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"   # padrão root; use LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) para não criar arquivos de root
    ports:
      - "${API_PORT:-8010}:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      TRAJVIZ_CTB_DIR: /app/data/raw/codetracebench
    volumes:
      - ./data/samples:/app/data/samples:ro      # amostras da biblioteca (fora do git; ver README)
      - ./data/raw/codetracebench:/app/data/raw/codetracebench:ro   # opcional: manifest + artefatos do CodeTraceBench (gabarito)
      - ./backend/.cache:/app/backend/.cache     # cache em disco (id = hash do arquivo) e contador de custo do LLM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
